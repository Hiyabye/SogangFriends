name: controlled meal comparison
on:
  workflow_dispatch:
    inputs:
      ticket:
        description: Operator-preallocated single-use D1 comparison ticket
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: meal-comparison
  cancel-in-progress: false
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run the reserved comparison without serving or Discord delivery
        run: node scripts/compare-meal.mjs
        env:
          NODE_EXTRA_CA_CERTS: certificates/sogang-ov-r36.pem
          MEAL_COMPARE_TICKET: ${{ inputs.ticket }}
          NOTICE_INGEST_URL: ${{ vars.NOTICE_INGEST_URL || secrets.NOTICE_INGEST_URL }}
          NOTICE_INGEST_SECRET: ${{ secrets.NOTICE_INGEST_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Retain the diagnostic briefly for source comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-comparison-${{ github.run_id }}
          path: meal-comparison-result/result.json
          if-no-files-found: ignore
          retention-days: 3
