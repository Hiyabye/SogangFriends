name: manual meal OCR verification
on:
  workflow_dispatch:
    inputs:
      ingest:
        description: 'Operator-approved live D1 ingestion (false = OCR verification only; never posts to Discord)'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: meal-ocr
  cancel-in-progress: false
jobs:
  ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_EXTRA_CA_CERTS: certificates/sogang-ov-r36.pem
      OCR_OUTPUT: scripts/meal-ocr/output/actions-run
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test the scoped ingestion client
        run: node --test scripts/meal-ocr/collect.node-tests.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/meal-ocr/requirements-actions.lock
      - name: Install pinned CPU OCR environment
        run: python -m pip install --require-hashes -r scripts/meal-ocr/requirements-actions.lock
      - name: Restore official model weights (not serving results)
        uses: actions/cache@v4
        with:
          path: |
            ~/.paddlex/official_models
            ~/.EasyOCR/model
          key: meal-ocr-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/meal-ocr/requirements-actions.lock', 'scripts/meal-ocr/evaluation-summary.json') }}
      - name: Test crop and date invariants
        run: python -m unittest discover -s scripts/meal-ocr -p 'test_*.py' -q
      - name: Exercise both native engines and verify model weights
        run: |
          mkdir -p scripts/meal-ocr/output
          python scripts/meal-ocr/runtime-check.py --output scripts/meal-ocr/output/runtime-check.json > scripts/meal-ocr/output/runtime-engine.log 2>&1
      - name: Collect retained official sources without ingestion
        if: ${{ !inputs.ingest }}
        run: node scripts/meal-ocr/collect.mjs prepare --output "$OCR_OUTPUT"
      - name: Capture sources and consult the live exact-identity cache
        if: ${{ inputs.ingest }}
        run: node scripts/meal-ocr/collect.mjs prepare --cache --output "$OCR_OUTPUT"
        env:
          MEAL_OCR_INGEST_URL: ${{ vars.MEAL_OCR_INGEST_URL || secrets.MEAL_OCR_INGEST_URL }}
          MEAL_OCR_INGEST_SECRET: ${{ secrets.MEAL_OCR_INGEST_SECRET }}
      - name: Verify real OCR on at least one source
        if: ${{ !inputs.ingest }}
        run: python scripts/meal-ocr/run-batch.py --output "$OCR_OUTPUT" --require-processed
      - name: Process uncached weeks for approved ingestion
        if: ${{ inputs.ingest }}
        run: python scripts/meal-ocr/run-batch.py --output "$OCR_OUTPUT"
      - name: Ingest only an entirely successful batch (no Discord delivery jobs)
        if: ${{ success() && inputs.ingest }}
        run: node scripts/meal-ocr/collect.mjs ingest --output "$OCR_OUTPUT"
        env:
          MEAL_OCR_INGEST_URL: ${{ vars.MEAL_OCR_INGEST_URL || secrets.MEAL_OCR_INGEST_URL }}
          MEAL_OCR_INGEST_SECRET: ${{ secrets.MEAL_OCR_INGEST_SECRET }}
      - name: Retain bounded results for review, without source images or engine logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-ocr-${{ github.run_id }}
          path: |
            scripts/meal-ocr/output/runtime-check.json
            scripts/meal-ocr/output/actions-run/batch-summary.json
            scripts/meal-ocr/output/actions-run/week-*/ocr/result.json
            scripts/meal-ocr/output/actions-run/week-*/ocr/diagnostic.json
          if-no-files-found: ignore
          retention-days: 3
