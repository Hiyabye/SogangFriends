name: collect notices
on:
  schedule:
    - cron: '10 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notice-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect and submit six official notice boards
        run: |
          if [[ -z "$NOTICE_INGEST_URL" ]]; then
            echo "::error::Set the Actions variable NOTICE_INGEST_URL (or a secret with the same name)."
            exit 1
          fi
          if [[ -z "$NOTICE_INGEST_SECRET" ]]; then
            echo "::error::Set the Actions secret NOTICE_INGEST_SECRET to match the Worker secret."
            exit 1
          fi
          npm run notices:collect -- --send
        env:
          NOTICE_INGEST_URL: ${{ vars.NOTICE_INGEST_URL || secrets.NOTICE_INGEST_URL }}
          NOTICE_INGEST_SECRET: ${{ secrets.NOTICE_INGEST_SECRET }}
          NOTICE_ARCHIVE_ENABLED: ${{ vars.NOTICE_ARCHIVE_ENABLED || 'false' }}
