name = "sogang-friends-bot"
main = "src/worker.ts"
compatibility_date = "2026-10-09"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]

[vars]
DISCORD_APPLICATION_ID = "1558118082914943086"
DISCORD_PUBLIC_KEY = "f436edec4bca28b9491464c4b84525f1596d5f37d73394aad5c3043f965414c4"
ALLOWED_GUILDS = "1558118900347183374"
SOURCE_INTERVAL_HOURS = "6"
# Six-board Node collector supplies authenticated snapshots; Worker Cron remains for meals/schedules.
NOTICE_COLLECTION_MODE = "external"
# Apply D1 archive migrations 0003 + 0004 before separately approved activation.
NOTICE_ARCHIVE_ENABLED = "true"
MEAL_TIME_KST = "07:30"

[[d1_databases]]
binding = "DB"
database_name = "sogang-friends"
database_id = "6fc1eae2-2847-478c-9b7a-21a6d6a6d8c5"
migrations_dir = "migrations"

[[queues.producers]]
queue = "sogang-jobs"
binding = "JOBS"

[[queues.consumers]]
queue = "sogang-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "sogang-jobs-dlq"
